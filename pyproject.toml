[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "character-model-suite"
version = "0.1.0"
description = "A modular, reproducible LoRA/QLoRA workspace for a character across media modalities."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "geinigegastcoding" }]
dependencies = [
  "huggingface_hub>=0.25",
  "modal>=0.73",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

